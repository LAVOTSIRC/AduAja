<html
  lang="id"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/master}"
>
  <th:block layout:fragment="extraHead">
    <title>AduAja - Kelola Petugas</title>
    <style>
      [x-cloak] { display: none !important; }
    </style>
  </th:block>

  <div layout:fragment="content" class="min-h-screen bg-gray-50">
    <header class="bg-white border-b sticky top-0 z-10">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900">Kelola Petugas</h1>
            <p class="text-sm text-gray-600">Daftar dan tambah petugas lapangan</p>
          </div>
          <a th:href="@{/admin/dinas/dashboard}"
             class="flex items-center gap-2 border border-gray-300 px-3 py-2 rounded-md text-sm hover:bg-gray-50">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Kembali ke Dashboard
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div th:if="${success}" class="mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm"
           th:text="${success}"></div>
      <div th:if="${error}" class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"
           th:text="${error}"></div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Form Tambah Petugas -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Tambah Petugas Baru</h2>
          <form th:action="@{/admin/dinas/petugas/create}" method="post" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
              <input type="text" name="fullName" required
                     class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input type="email" name="email" required
                     class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nomor HP</label>
              <input type="text" name="phoneNumber"
                     class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input type="password" name="password" required minlength="6"
                     class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
              <p class="text-xs text-gray-500 mt-1">Minimal 6 karakter</p>
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">
              <i data-lucide="user-plus" class="w-4 h-4 inline mr-1"></i>
              Buat Petugas
            </button>
          </form>
        </div>

        <!-- Daftar Petugas -->
        <div class="lg:col-span-2 bg-white rounded-xl border border-gray-100 shadow-sm p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Daftar Petugas</h2>
          <div th:if="${#lists.isEmpty(petugasList)}" class="text-center py-12 text-gray-400">
            <i data-lucide="users" class="w-12 h-12 mx-auto mb-3"></i>
            <p class="text-sm">Belum ada petugas terdaftar</p>
          </div>
          <div th:unless="${#lists.isEmpty(petugasList)}" class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b text-left text-gray-600">
                  <th class="pb-3 font-medium">Nama</th>
                  <th class="pb-3 font-medium">Email</th>
                  <th class="pb-3 font-medium">No. HP</th>
                  <th class="pb-3 font-medium">Status</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${petugasList}" class="border-b hover:bg-gray-50">
                  <td class="py-3 font-medium text-gray-900" th:text="${p.fullName}">Nama</td>
                  <td class="py-3 text-gray-600" th:text="${p.email}">Email</td>
                  <td class="py-3 text-gray-600" th:text="${p.phoneNumber != null ? p.phoneNumber : '-'}">HP</td>
                  <td class="py-3">
                    <span class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700"
                          th:text="${p.accountStatus.name()}">Active</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</html>
