<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/master}">
<th:block layout:fragment="extraHead">
  <title>AduAja - Ganti Password Wajib</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</th:block>

<div layout:fragment="content" class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900 tracking-tight">
        Keamanan Akun
      </h2>
      <p class="mt-4 text-center text-sm text-gray-600 bg-yellow-50 p-3 rounded-md border border-yellow-200">
        <span class="font-bold text-yellow-700">Wajib Ganti Password!</span><br>
        Ini adalah login pertama Anda. Untuk alasan keamanan, Anda diwajibkan untuk mengganti password default dengan password baru.
      </p>
    </div>

    <!-- Alert Error -->
    <div th:if="${error}" class="bg-red-50 border-l-4 border-red-500 p-4 mb-4 rounded-md">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-700" th:text="${error}"></p>
        </div>
      </div>
    </div>

    <form class="mt-8 space-y-6" th:action="@{/petugas/change-password}" method="POST">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
          <input id="newPassword" name="newPassword" type="password" required
                 class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                 placeholder="Masukkan password baru">
        </div>
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" required
                 class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                 placeholder="Ulangi password baru">
        </div>
      </div>

      <div>
        <button type="submit"
                class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 shadow-md transition-all">
          Simpan Password Baru
        </button>
      </div>
    </form>
  </div>
</div>
</html>
